name: CI — Neuratia

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Frontend: oxlint + TypeScript type-check ─────────────────────────────────
  frontend-lint:
    name: Frontend — Lint & Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: oxlint
        run: npm run lint

      - name: TypeScript type-check
        run: npx tsc --noEmit

  # ── Backend: ruff linter ─────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Ruff Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.8.6

      - name: Ruff check
        run: ruff check app/

  # ── Backend: pytest ──────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Tests (43 tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        # All placeholder env vars — tests must pass with no real API credentials
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          SUPABASE_JWT_SECRET: placeholder-jwt-secret
          GROQ_API_KEY: placeholder-groq-key
          GEMINI_API_KEY: placeholder-gemini-key
          ENVIRONMENT: test
        run: pytest tests/ -v --tb=short

  # ── Secrets scan: block any committed secrets before merge ───────────────────
  secrets-scan:
    name: Secrets Scan — TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
